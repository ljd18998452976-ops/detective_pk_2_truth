<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔法学院 PK 2.0：最强小巫师争霸赛</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
  <style>
    :root{
      --ink:#f8f5ff;
      --purple:#7c3aed;
      --deep:#10051f;
      --gold:#f7d774;
    }
    *{box-sizing:border-box}
    body{
      font-family:'Noto Sans SC',sans-serif;
      color:var(--ink);
      min-height:100vh;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 20% 18%, rgba(168,85,247,.45), transparent 22%),
        radial-gradient(circle at 80% 12%, rgba(56,189,248,.22), transparent 18%),
        radial-gradient(circle at 55% 80%, rgba(245,158,11,.18), transparent 25%),
        linear-gradient(135deg,#080214 0%,#160329 38%,#071527 72%,#1d0b32 100%);
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.75) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.35) 0 1px, transparent 1.5px);
      background-size:64px 64px, 110px 110px;
      background-position:0 0, 22px 35px;
      opacity:.45;
      animation:twinkle 7s linear infinite alternate;
    }
    @keyframes twinkle{from{opacity:.28}to{opacity:.58}}
    .arcane-card{
      background:linear-gradient(180deg,rgba(27,12,55,.94),rgba(10,13,38,.94));
      border:2px solid rgba(247,215,116,.7);
      box-shadow:0 0 22px rgba(124,58,237,.35), inset 0 0 18px rgba(255,255,255,.05);
      backdrop-filter: blur(8px);
    }
    .parchment{
      background:linear-gradient(180deg,#fff8dc,#f5e6b8);
      color:#2d1603;
      border:4px solid #8b5a18;
      box-shadow:0 12px 30px rgba(0,0,0,.55), inset 0 0 20px rgba(139,90,24,.25);
    }
    #game-screen{min-height:100vh}
    #wheel{
      border-radius:50%;
      border:10px solid rgba(247,215,116,.9);
      background:conic-gradient(
        #6d28d9 0deg 80deg,    /* ✦ 魔法书：22.2% */
        #0891b2 80deg 160deg,   /* ◆ 魔法宝石：22.2% */
        #f59e0b 160deg 210deg,  /* ★ 魔杖：13.9% */
        #b91c1c 210deg 275deg,  /* × 龙的挑战：18.1% */
        #4f46e5 275deg 300deg,  /* □ 魔法护盾：6.9% */
        #10b981 300deg 360deg   /* ? 咒语卡：16.7% */
      );
      box-shadow:0 0 24px rgba(247,215,116,.7), 0 0 60px rgba(124,58,237,.65), inset 0 0 25px rgba(0,0,0,.65);
      position:relative;
      transition:transform 4s cubic-bezier(.25,1,.5,1);
      width:100%;height:100%;
    }
    #wheel::before{
      content:"";
      position:absolute;
      inset:28px;
      border-radius:50%;
      border:2px dashed rgba(255,255,255,.55);
      box-shadow:inset 0 0 20px rgba(255,255,255,.12);
    }
    #wheel::after{
      content:"✦  ✧  ✦  ✧  ✦";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,.36);
      font-size:30px;
      letter-spacing:12px;
      transform:rotate(-18deg);
    }
    .wheel-section-content{position:absolute;width:100%;height:100%;top:0;left:0;pointer-events:none;z-index:2}
    .wheel-symbol{
      position:absolute;top:50%;left:50%;transform-origin:center;
      color:#fff8dc;font-weight:900;
      text-shadow:0 0 8px rgba(255,255,255,.9),0 0 16px rgba(247,215,116,.8),2px 2px 3px rgba(0,0,0,.7);
    }
    #spin-btn{border:4px solid var(--gold);box-shadow:0 6px #5b3b06,0 0 20px rgba(255,255,255,.3);position:relative}
    #spin-btn:active:not(:disabled){box-shadow:0 2px #5b3b06;transform:translateY(4px)}
    #spin-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;background:#64748b!important}
    #spin-btn::before{
      content:"";position:absolute;top:-40px;left:50%;transform:translateX(-50%);
      width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:40px solid #facc15;z-index:30;
      filter:drop-shadow(0 0 8px rgba(250,204,21,.85));
    }
    .teams-table{width:100%;border-collapse:collapse;background:rgba(17,24,39,.72);border:2px solid rgba(247,215,116,.75);box-shadow:0 0 18px rgba(124,58,237,.38)}
    .teams-table th,.teams-table td{border:1px solid rgba(247,215,116,.45);padding:8px;text-align:center;vertical-align:middle;color:#fff7ed}
    .teams-table th{background:rgba(124,58,237,.34);font-weight:900;color:#fde68a}
    .teams-table .active-col{background:rgba(250,204,21,.15);box-shadow:inset 0 0 14px rgba(250,204,21,.22)}
    .asset-name{font-weight:900;white-space:nowrap;color:#fde68a!important}
    .asset-symbol{display:inline-block;min-width:1.2em;font-weight:900;color:#fef3c7}
    .btn{transition:all .18s ease;box-shadow:0 4px rgba(0,0,0,.4)}
    .btn:active:not(:disabled){box-shadow:0 2px rgba(0,0,0,.45);transform:translateY(2px)}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .glow-title{text-shadow:0 0 10px rgba(250,204,21,.9),0 0 28px rgba(124,58,237,.95)}
    .spell-badge{display:inline-block;border-radius:999px;padding:2px 8px;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.35);font-size:12px;font-weight:900;color:#5b21b6}
  </style>
</head>
<body class="w-screen flex items-center justify-center p-4">
  <div id="setup-screen" class="w-full max-w-lg mx-auto text-center relative z-10">
    <h1 class="text-4xl sm:text-5xl md:text-6xl font-black text-amber-200 mb-6 glow-title">魔法学院 PK</h1>
    <div class="arcane-card p-6 sm:p-8 rounded-3xl">
      <h2 class="text-2xl sm:text-3xl font-black text-amber-100 mb-3">最强小巫师争霸赛</h2>
      <p class="text-sm text-violet-100/90 mb-5 leading-relaxed">答对题才能施法，转动魔法阵收集资源。龙会抢夺，咒语卡会触发神秘效果，防护道具概率较低，集齐条件后参加终极魔法考试。</p>
      <div class="mb-5 text-left">
        <label for="team-count" class="block text-lg mb-2 text-amber-100">选择学院数量：</label>
        <select id="team-count" class="w-full p-3 text-lg border-2 border-amber-300 rounded-xl bg-slate-950 text-amber-100">
          <option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </div>
      <div id="team-names-container" class="space-y-3 mb-6"></div>
      <div class="rounded-2xl bg-black/25 border border-amber-200/40 p-4 text-left text-sm text-violet-50 mb-6">
        <div class="font-black text-amber-100 mb-2">胜利条件</div>
        <div>集齐 <b>✦ 魔法书 x2</b> + <b>★ 魔杖 x1</b> + <b>◆ 魔法宝石 x1</b> 后，参加终极魔法考试。</div>
      </div>
      <button id="start-game-btn" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-black py-4 px-4 rounded-2xl text-xl sm:text-2xl btn">开启魔法试炼</button>
    </div>
  </div>

  <div id="game-screen" class="hidden w-full max-w-7xl mx-auto flex-col lg:flex-row items-center justify-center gap-8 relative z-10">
    <div class="w-full lg:w-3/5 flex items-center justify-center">
      <div id="wheel-container" class="relative w-[300px] h-[300px] sm:w-[450px] sm:h-[450px] md:w-[500px] md:h-[500px] flex items-center justify-center mx-auto">
        <div id="wheel"></div>
        <div class="absolute w-full h-full flex items-center justify-center z-10">
          <button id="spin-btn" class="w-[108px] h-[108px] sm:w-[130px] sm:h-[130px] rounded-full text-lg sm:text-xl font-black bg-violet-700 hover:bg-violet-800 text-white z-20" disabled>转动<br>魔法阵</button>
        </div>
      </div>
    </div>

    <div class="w-full lg:w-2/5 flex flex-col gap-5 items-center justify-start">
      <div class="w-full text-center p-4 rounded-2xl arcane-card">
        <p id="action-prompt" class="text-xl sm:text-2xl text-amber-50 min-h-[74px] flex items-center justify-center leading-relaxed"></p>
      </div>
      <div id="answer-controls" class="hidden justify-center gap-4 sm:gap-8 w-full">
        <button id="correct-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3 px-8 rounded-xl text-lg sm:text-xl btn">施法成功</button>
        <button id="incorrect-btn" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-black py-3 px-8 rounded-xl text-lg sm:text-xl btn">咒语失败</button>
      </div>
      <div id="controls" class="w-full">
        <button id="start-round-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-4 px-12 rounded-xl text-xl sm:text-2xl btn">开始游戏</button>
      </div>
      <div id="teams-info-container" class="w-full mt-2"></div>
      <div id="rules-container" class="w-full mt-1 text-center text-violet-100"></div>
      <button id="back-to-setup-btn" class="w-full bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-4 rounded-xl text-lg btn">返回设置</button>
    </div>
  </div>

  <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50 p-4">
    <div id="victory-modal" class="parchment p-8 sm:p-10 rounded-3xl text-center hidden flex-col items-center w-full max-w-md">
      <h2 class="text-4xl sm:text-5xl font-black text-violet-800 mb-4">魔法考试通过！</h2>
      <p id="victory-message" class="text-xl sm:text-2xl text-stone-900 mb-8 leading-relaxed"></p>
      <button onclick="location.reload()" class="bg-violet-700 hover:bg-violet-800 text-white font-black py-3 px-8 rounded-xl text-xl btn">再来一局</button>
    </div>

    <div id="steal-modal" class="parchment p-6 sm:p-8 rounded-3xl text-center hidden w-full max-w-lg">
      <h2 class="text-3xl font-black text-red-800 mb-4">龙的挑战</h2>
      <p class="text-lg text-stone-800 mb-5">选择一项资源进行抢夺。若对方有魔法护盾，将自动抵消。</p>
      <div id="steal-options" class="space-y-3 max-h-72 overflow-y-auto"></div>
    </div>

    <div id="choice-modal" class="parchment p-6 sm:p-8 rounded-3xl text-center hidden w-full max-w-lg">
      <h2 id="choice-title" class="text-3xl font-black text-violet-800 mb-4"></h2>
      <p id="choice-prompt" class="text-lg text-stone-800 mb-5 leading-relaxed"></p>
      <div id="choice-options" class="space-y-3 max-h-72 overflow-y-auto"></div>
    </div>

    <div id="spell-modal" class="parchment p-6 sm:p-8 rounded-3xl text-center hidden flex-col items-center w-full max-w-lg">
      <h2 class="text-3xl font-black text-violet-800 mb-4">咒语卡</h2>
      <div id="spell-card-content" class="text-stone-900 mb-6 leading-relaxed"></div>
      <button id="spell-ok-btn" class="bg-violet-700 hover:bg-violet-800 text-white font-black py-3 px-8 rounded-xl text-lg btn">释放咒语</button>
    </div>

    <div id="final-modal" class="parchment p-6 sm:p-8 rounded-3xl text-center hidden flex-col items-center w-full max-w-lg">
      <h2 class="text-3xl font-black text-violet-800 mb-4">终极魔法考试</h2>
      <p id="final-message" class="text-xl text-stone-900 mb-6 leading-relaxed"></p>
      <div class="w-full flex flex-col gap-3">
        <button id="final-success-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 px-6 rounded-xl text-lg btn">考试通过</button>
        <button id="final-fail-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3 px-6 rounded-xl text-lg btn">考试失败</button>
        <button id="final-cancel-btn" class="w-full bg-gray-500 hover:bg-gray-600 text-white font-black py-3 px-6 rounded-xl text-lg btn">暂不考试</button>
      </div>
    </div>
  </div>

<script>
window.onload = function(){
  const setupScreen = document.getElementById('setup-screen');
  const gameScreen = document.getElementById('game-screen');
  const teamCountSelect = document.getElementById('team-count');
  const teamNamesContainer = document.getElementById('team-names-container');
  const startGameBtn = document.getElementById('start-game-btn');
  const actionPrompt = document.getElementById('action-prompt');
  const teamsInfoContainer = document.getElementById('teams-info-container');
  const wheel = document.getElementById('wheel');
  const startRoundBtn = document.getElementById('start-round-btn');
  const spinBtn = document.getElementById('spin-btn');
  const modalOverlay = document.getElementById('modal-overlay');
  const victoryModal = document.getElementById('victory-modal');
  const victoryMessage = document.getElementById('victory-message');
  const stealModal = document.getElementById('steal-modal');
  const stealOptions = document.getElementById('steal-options');
  const choiceModal = document.getElementById('choice-modal');
  const choiceTitle = document.getElementById('choice-title');
  const choicePrompt = document.getElementById('choice-prompt');
  const choiceOptions = document.getElementById('choice-options');
  const spellModal = document.getElementById('spell-modal');
  const spellCardContent = document.getElementById('spell-card-content');
  const spellOkBtn = document.getElementById('spell-ok-btn');
  const finalModal = document.getElementById('final-modal');
  const finalMessage = document.getElementById('final-message');
  const finalSuccessBtn = document.getElementById('final-success-btn');
  const finalFailBtn = document.getElementById('final-fail-btn');
  const finalCancelBtn = document.getElementById('final-cancel-btn');
  const answerControls = document.getElementById('answer-controls');
  const correctBtn = document.getElementById('correct-btn');
  const incorrectBtn = document.getElementById('incorrect-btn');
  const rulesContainer = document.getElementById('rules-container');
  const backToSetupBtn = document.getElementById('back-to-setup-btn');

  let teams = [];
  let currentPlayerIndex = 0;
  let isSpinning = false;
  let currentWheelRotation = 0;
  let isExtraSpinQuestion = false;
  let pendingExamTeamIndex = null;

  const defaultNames = ['星辰学院','月影学院','火焰学院','森林学院','水晶学院','夜鸦学院'];
  const wheelSections = [
    {result:'book', symbol:'✦', label:'魔法书', deg:80},      // 22.2%：基础资源，需求量最高
    {result:'gem', symbol:'◆', label:'魔法宝石', deg:80},    // 22.2%：核心资源，也可兑换
    {result:'wand', symbol:'★', label:'魔杖', deg:50},       // 13.9%：强力资源，概率中等偏低
    {result:'dragon', symbol:'×', label:'龙的挑战', deg:65}, // 18.1%：增加PK感
    {result:'shield', symbol:'□', label:'魔法护盾', deg:25}, // 6.9%：保护道具，避免过多
    {result:'spell', symbol:'?', label:'咒语卡', deg:60}     // 16.7%：随机事件，保持惊喜
  ];

  // --- 魔法音效系统 ---
  const synth = new Tone.Synth({
    oscillator:{type:'triangle'},
    envelope:{attack:0.01, decay:0.18, sustain:0.25, release:0.45}
  }).toDestination();
  const pluckSynth = new Tone.PluckSynth({attackNoise:0.7, dampening:4200, resonance:0.82}).toDestination();
  const metalSynth = new Tone.MetalSynth({
    frequency:180,
    envelope:{attack:.001,decay:.35,release:.2},
    harmonicity:4.5,
    modulationIndex:26,
    resonance:3500,
    octaves:1.4
  }).toDestination();
  const dragonSynth = new Tone.MembraneSynth({
    pitchDecay:0.06,
    octaves:5,
    oscillator:{type:'sine'},
    envelope:{attack:0.001, decay:0.55, sustain:0.02, release:0.25}
  }).toDestination();
  const magicVolume = new Tone.Volume(-4).toDestination();
  synth.connect(magicVolume);
  pluckSynth.connect(magicVolume);
  metalSynth.connect(magicVolume);
  dragonSynth.connect(magicVolume);

  async function unlockAudio(){
    try{
      if(Tone.context.state !== 'running') await Tone.start();
    }catch(e){}
  }
  function playSound(note,duration='8n'){
    try{ unlockAudio(); synth.triggerAttackRelease(note,duration); }catch(e){}
  }
  function playMagic(){
    try{
      unlockAudio();
      const now=Tone.now();
      metalSynth.triggerAttackRelease('C5','16n',now);
      pluckSynth.triggerAttackRelease('E5','16n',now+0.08);
      pluckSynth.triggerAttackRelease('G5','16n',now+0.16);
    }catch(e){}
  }
  function playCorrectSound(){
    try{
      unlockAudio();
      const now=Tone.now();
      ['C5','E5','G5'].forEach((n,i)=>synth.triggerAttackRelease(n,'16n',now+i*0.09));
    }catch(e){}
  }
  function playWrongSound(){
    try{
      unlockAudio();
      const now=Tone.now();
      synth.triggerAttackRelease('C3','8n',now);
      synth.triggerAttackRelease('G2','8n',now+0.18);
    }catch(e){}
  }
  function playSpinSound(){
    try{
      unlockAudio();
      const now=Tone.now();
      ['C4','D4','E4','G4','A4','C5','A4','G4','E4','D4','C4'].forEach((n,i)=>{
        pluckSynth.triggerAttackRelease(n,'32n',now+i*0.08);
      });
    }catch(e){}
  }
  function playSpellSound(){
    try{
      unlockAudio();
      const now=Tone.now();
      ['D5','F5','A5','C6'].forEach((n,i)=>synth.triggerAttackRelease(n,'16n',now+i*0.08));
      metalSynth.triggerAttackRelease('A4','16n',now+0.22);
    }catch(e){}
  }
  function playShieldSound(){
    try{
      unlockAudio();
      const now=Tone.now();
      synth.triggerAttackRelease('G4','8n',now);
      synth.triggerAttackRelease('C5','8n',now+0.12);
      metalSynth.triggerAttackRelease('E5','16n',now+0.2);
    }catch(e){}
  }
  function playDragonSound(){
    try{
      unlockAudio();
      const now=Tone.now();
      dragonSynth.triggerAttackRelease('C2','8n',now);
      dragonSynth.triggerAttackRelease('G1','8n',now+0.22);
    }catch(e){}
  }
  function playVictorySound(){
    try{
      unlockAudio();
      const now=Tone.now();
      ['C5','E5','G5','C6','G5','C6'].forEach((n,i)=>synth.triggerAttackRelease(n,'8n',now+i*0.12));
      metalSynth.triggerAttackRelease('C6','8n',now+0.45);
    }catch(e){}
  }
  function playExamFailSound(){
    try{
      unlockAudio();
      const now=Tone.now();
      ['A3','F3','D3'].forEach((n,i)=>synth.triggerAttackRelease(n,'8n',now+i*0.12));
    }catch(e){}
  }

  function makeTeam(name){return {name,books:0,wands:0,gems:0,shields:0,potions:0,skipTurns:0};}
  function canTakeExam(t){return t.books>=2 && t.wands>=1 && t.gems>=1;}
  function labels(){return {books:'魔法书',gems:'魔法宝石',wands:'魔杖',potions:'魔法药水'};}

  const spellCards = [
    {symbol:'L', name:'Lumos 光亮咒', text:'魔法书页自动发光，获得 1 本魔法书。', action:()=>{teams[currentPlayerIndex].books+=1; return true;}},
    {symbol:'P', name:'Protego 防护咒', text:'召唤防护结界，获得 1 个魔法护盾。', action:()=>{teams[currentPlayerIndex].shields+=1; return true;}},
    {symbol:'A', name:'Accio 召唤咒', text:'从其他学院召唤 1 个魔法宝石。', action:()=>{chooseTeamToStealGem(); return false;}},
    {symbol:'W', name:'Wingardium 漂浮咒', text:'再回答一道题，答对后可以额外转动一次魔法阵。', action:()=>{startExtraSpinQuestion(); return false;}},
    {symbol:'O', name:'Obliviate 遗忘咒', text:'指定一个学院失去 1 本魔法书。', action:()=>{chooseTeamToLoseBook(); return false;}},
    {symbol:'F', name:'Felix 幸运咒', text:'随机获得 1 个魔法资源。', action:()=>{giveRandomResource(currentPlayerIndex); return true;}},
    {symbol:'M', name:'Moon Potion 月光药水', text:'获得 1 瓶魔法药水，可在商店兑换资源。', action:()=>{teams[currentPlayerIndex].potions+=1; return true;}}
  ];

  function updateTeamNameInputs(){
    const count = parseInt(teamCountSelect.value);
    teamNamesContainer.innerHTML='';
    for(let i=0;i<count;i++){
      const input=document.createElement('input');
      input.type='text'; input.id=`team-name-${i}`; input.value=defaultNames[i];
      input.className='w-full p-3 text-lg border-2 border-amber-300 rounded-xl bg-slate-950/80 text-amber-100 placeholder:text-violet-200';
      teamNamesContainer.appendChild(input);
    }
  }

  function setupGame(){
    const count=parseInt(teamCountSelect.value);
    teams=[];
    for(let i=0;i<count;i++){
      const input=document.getElementById(`team-name-${i}`);
      teams.push(makeTeam(input.value.trim() || `魔法学院 ${i+1}`));
    }
    setupScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    gameScreen.classList.add('flex');
    currentPlayerIndex=-1;
    positionWheelSymbols();
    updateUI();
    actionPrompt.textContent='请点击“开始游戏”，开启第一轮魔法试炼！';
    playSpellSound();
    rulesContainer.innerHTML='<p class="text-sm font-bold">胜利条件：✦魔法书 x2 + ★魔杖 x1 + ◆宝石 x1，然后参加终极魔法考试。</p><p class="text-xs mt-1">转盘概率：✦22.2% / ◆22.2% / ★13.9% / ×18.1% / □6.9% / ?16.7%。◆x3 可换 ★；◆x2 可换 □；✦x3 可换 ◆；☽x2 可换 ◆。</p>';
  }

  function positionWheelSymbols(){
    wheel.innerHTML='';
    const r=wheel.offsetWidth/2;
    const size=Math.max(42,r*.20);
    const trans=r*.66;
    let startAngle = 0;
    wheelSections.forEach((section)=>{
      const angle=startAngle + section.deg / 2;
      startAngle += section.deg;
      const div=document.createElement('div');
      div.className='wheel-section-content';
      const transform=`translate(-50%, -50%) rotate(${angle}deg) translateY(-${trans}px) rotate(-${angle}deg)`;
      div.innerHTML=`<span class="wheel-symbol" style="font-size:${size}px; transform:${transform};">${section.symbol}</span>`;
      wheel.appendChild(div);
    });
  }

  function updateUI(){
    teamsInfoContainer.innerHTML='';
    const table=document.createElement('table');
    table.className='teams-table text-base sm:text-lg';
    let html='<thead><tr><th>魔法资源</th>';
    teams.forEach((t,i)=>{html+=`<th class="${i===currentPlayerIndex?'active-col':''}">${t.name}${t.skipTurns>0?' <span class="text-xs text-red-300">暂停</span>':''}</th>`});
    html+='</tr></thead><tbody>';
    const rows=[['✦','魔法书','books','/ 2'],['★','魔杖','wands','/ 1'],['◆','魔法宝石','gems','/ 1'],['□','魔法护盾','shields',''],['☽','魔法药水','potions','']];
    rows.forEach(([sym,name,key,goal])=>{
      html+=`<tr><td class="asset-name"><span class="asset-symbol">${sym}</span> ${name}</td>`;
      teams.forEach((t,i)=>{html+=`<td class="${i===currentPlayerIndex?'active-col':''}">${t[key]} ${goal}</td>`});
      html+='</tr>';
    });
    html+='<tr><td class="asset-name">魔法商店</td>';
    teams.forEach((t,i)=>{
      html+=`<td class="${i===currentPlayerIndex?'active-col':''}"><div class="flex flex-col gap-2 items-center">
        <button class="shop-btn bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-1 px-2 rounded-md text-xs btn" data-index="${i}" data-shop="gemToWand" ${t.gems<3?'disabled':''}>3◆换1★</button>
        <button class="shop-btn bg-indigo-500 hover:bg-indigo-600 text-white font-black py-1 px-2 rounded-md text-xs btn" data-index="${i}" data-shop="gemToShield" ${t.gems<2?'disabled':''}>2◆换1□</button>
        <button class="shop-btn bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-black py-1 px-2 rounded-md text-xs btn" data-index="${i}" data-shop="bookToGem" ${t.books<3?'disabled':''}>3✦换1◆</button>
        <button class="shop-btn bg-fuchsia-500 hover:bg-fuchsia-600 text-white font-black py-1 px-2 rounded-md text-xs btn" data-index="${i}" data-shop="potionToGem" ${t.potions<2?'disabled':''}>2☽换1◆</button>
      </div></td>`;
    });
    html+='</tr><tr><td class="asset-name">最终考试</td>';
    teams.forEach((t,i)=>{
      html+=`<td class="${i===currentPlayerIndex?'active-col':''}"><button class="exam-btn bg-red-600 hover:bg-red-700 text-white font-black py-2 px-3 rounded-lg text-sm btn" data-index="${i}" ${!canTakeExam(t)?'disabled':''}>参加考试</button></td>`;
    });
    html+='</tr></tbody>';
    table.innerHTML=html;
    teamsInfoContainer.appendChild(table);
    document.querySelectorAll('.shop-btn').forEach(b=>b.addEventListener('click',e=>useShop(parseInt(e.target.dataset.index),e.target.dataset.shop)));
    document.querySelectorAll('.exam-btn').forEach(b=>b.addEventListener('click',e=>openFinalExam(parseInt(e.target.dataset.index))));
  }

  function startNextTurn(){
    let safety=0;
    do{
      currentPlayerIndex=(currentPlayerIndex+1)%teams.length;
      safety++;
      if(teams[currentPlayerIndex].skipTurns>0){
        teams[currentPlayerIndex].skipTurns-=1;
        actionPrompt.textContent=`【${teams[currentPlayerIndex].name}】被黑暗森林困住，暂停一轮！`;
        updateUI();
      }else break;
    }while(safety<=teams.length+2);
    updateUI();
    actionPrompt.textContent=`轮到【${teams[currentPlayerIndex].name}】回答问题，准备施法！`;
    spinBtn.disabled=true; isSpinning=false;
    correctBtn.disabled=false; incorrectBtn.disabled=false;
    answerControls.classList.remove('hidden'); answerControls.classList.add('flex');
  }

  function getWheelResultByAngle(angle){
    let current = 0;
    for (const section of wheelSections) {
      current += section.deg;
      if (angle < current) return section;
    }
    return wheelSections[wheelSections.length - 1];
  }

  function handleSpinResult(result){
    isSpinning=false;
    const t=teams[currentPlayerIndex];
    actionPrompt.innerHTML=`【${t.name}】转到了：<span class="text-4xl font-black text-amber-200">${result.symbol}</span> ${result.label}`;
    switch(result.result){
      case 'book': t.books+=1; playSound('E4'); updateUI(); setTimeout(()=>checkReadyAndSwitch(true),1200); break;
      case 'gem': t.gems+=1; playMagic(); updateUI(); setTimeout(()=>checkReadyAndSwitch(true),1200); break;
      case 'wand': t.wands+=1; playSound('A5'); updateUI(); setTimeout(()=>checkReadyAndSwitch(true),1200); break;
      case 'shield': t.shields+=1; playSound('G5'); updateUI(); setTimeout(()=>checkReadyAndSwitch(true),1200); break;
      case 'dragon': playDragonSound(); handleDragon(); break;
      case 'spell': playSpellSound(); drawSpellCard(); break;
    }
  }

  function handleDragon(){
    stealOptions.innerHTML='';
    let hasTargets=false;
    teams.forEach((target,idx)=>{
      if(idx===currentPlayerIndex) return;
      [['books','魔法书','bg-violet-700 hover:bg-violet-800'],['gems','魔法宝石','bg-cyan-700 hover:bg-cyan-800'],['wands','魔杖','bg-amber-600 hover:bg-amber-700'],['potions','魔法药水','bg-fuchsia-700 hover:bg-fuchsia-800']].forEach(([key,label,cls])=>{
        if(target[key]>0){
          hasTargets=true;
          const btn=document.createElement('button');
          btn.className=`block w-full ${cls} text-white font-black py-2 px-4 rounded-xl btn mb-2`;
          btn.textContent=`从【${target.name}】抢夺 1 个${label}${target.shields>0?'（对方有护盾）':''}`;
          btn.onclick=()=>performSteal(idx,key);
          stealOptions.appendChild(btn);
        }
      });
    });
    if(!hasTargets){
      actionPrompt.textContent='龙盘旋一圈，没有找到可抢夺的资源。';
      setTimeout(()=>checkReadyAndSwitch(true),1200); return;
    }
    const cancel=document.createElement('button');
    cancel.className='block w-full bg-gray-600 hover:bg-gray-700 text-white font-black py-2 px-4 rounded-xl btn mt-3';
    cancel.textContent='放弃挑战';
    cancel.onclick=()=>{closeAllModals(); checkReadyAndSwitch(true);};
    stealOptions.appendChild(cancel);
    showModal(stealModal);
  }

  function performSteal(targetIndex,key){
    const target=teams[targetIndex], current=teams[currentPlayerIndex];
    closeAllModals();
    if(target.shields>0){
      target.shields-=1;
      actionPrompt.textContent=`【${target.name}】的魔法护盾抵消了龙的挑战！`;
      playShieldSound();
    }else{
      target[key]-=1; current[key]+=1;
      actionPrompt.textContent=`【${current.name}】从【${target.name}】抢到了 1 个${labels()[key]}！`;
      playDragonSound(); if(key==='gems') playMagic();
    }
    updateUI(); setTimeout(()=>checkReadyAndSwitch(true),1200);
  }

  function drawSpellCard(){
    const card=spellCards[Math.floor(Math.random()*spellCards.length)];
    spellCardContent.innerHTML=`<div class="text-5xl font-black text-violet-800 mb-3">${card.symbol}</div><div class="spell-badge mb-3">${card.name}</div><div class="text-xl font-bold">${card.text}</div>`;
    showModal(spellModal);
    spellOkBtn.onclick=()=>{
      closeAllModals();
      const normal=card.action();
      updateUI();
      if(normal && !isExtraSpinQuestion) setTimeout(()=>checkReadyAndSwitch(true),800);
    };
  }

  function chooseTeamToStealGem(){
    choiceTitle.textContent='Accio 召唤咒';
    choicePrompt.textContent='选择一个学院，召唤它的 1 个魔法宝石。若对方有护盾，将自动抵消。';
    choiceOptions.innerHTML='';
    let any=false;
    teams.forEach((t,idx)=>{
      if(idx===currentPlayerIndex || t.gems<=0) return;
      any=true;
      const btn=document.createElement('button');
      btn.className='block w-full bg-cyan-700 hover:bg-cyan-800 text-white font-black py-2 px-4 rounded-xl btn mb-2';
      btn.textContent=`召唤【${t.name}】的 1 个宝石${t.shields>0?'（有护盾）':''}`;
      btn.onclick=()=>performSteal(idx,'gems');
      choiceOptions.appendChild(btn);
    });
    if(!any){actionPrompt.textContent='没有可召唤的宝石。'; setTimeout(()=>checkReadyAndSwitch(true),1000); return;}
    showModal(choiceModal);
  }

  function chooseTeamToLoseBook(){
    choiceTitle.textContent='Obliviate 遗忘咒';
    choicePrompt.textContent='选择一个学院，让它遗忘 1 本魔法书。';
    choiceOptions.innerHTML='';
    let any=false;
    teams.forEach((t,idx)=>{
      if(idx===currentPlayerIndex || t.books<=0) return;
      any=true;
      const btn=document.createElement('button');
      btn.className='block w-full bg-rose-700 hover:bg-rose-800 text-white font-black py-2 px-4 rounded-xl btn mb-2';
      btn.textContent=`让【${t.name}】失去 1 本魔法书`;
      btn.onclick=()=>{t.books-=1; closeAllModals(); actionPrompt.textContent=`【${t.name}】遗忘了 1 本魔法书！`; updateUI(); setTimeout(()=>checkReadyAndSwitch(true),1000);};
      choiceOptions.appendChild(btn);
    });
    if(!any){actionPrompt.textContent='没有可影响的魔法书。'; setTimeout(()=>checkReadyAndSwitch(true),1000); return;}
    showModal(choiceModal);
  }

  function giveRandomResource(teamIndex){
    const t=teams[teamIndex];
    const options=['books','gems','wands','shields','potions'];
    const key=options[Math.floor(Math.random()*options.length)];
    t[key]+=1;
    actionPrompt.textContent=`Felix 幸运咒生效！【${t.name}】获得 1 个${labels()[key] || '魔法护盾'}。`;
    playMagic();
  }

  function startExtraSpinQuestion(){
    isExtraSpinQuestion=true;
    actionPrompt.textContent=`【${teams[currentPlayerIndex].name}】请回答漂浮咒奖励题，答对可额外转动一次魔法阵！`;
    answerControls.classList.remove('hidden'); answerControls.classList.add('flex');
    correctBtn.disabled=false; incorrectBtn.disabled=false;
  }

  function useShop(index,type){
    const t=teams[index];
    if(type==='gemToWand' && t.gems>=3){t.gems-=3;t.wands+=1; actionPrompt.textContent=`【${t.name}】用 3 个魔法宝石兑换了 1 根魔杖！`;}
    if(type==='gemToShield' && t.gems>=2){t.gems-=2;t.shields+=1; actionPrompt.textContent=`【${t.name}】用 2 个魔法宝石兑换了 1 个魔法护盾！`;}
    if(type==='bookToGem' && t.books>=3){t.books-=3;t.gems+=1; actionPrompt.textContent=`【${t.name}】用 3 本魔法书兑换了 1 个魔法宝石！`;}
    if(type==='potionToGem' && t.potions>=2){t.potions-=2;t.gems+=1; actionPrompt.textContent=`【${t.name}】用 2 瓶魔法药水兑换了 1 个魔法宝石！`;}
    playMagic(); updateUI(); checkReadyAndSwitch(false);
  }

  function openFinalExam(index){
    pendingExamTeamIndex=index;
    finalMessage.innerHTML=`【${teams[index].name}】已集齐魔法资源！<br>请老师出一道终极魔法题，学生答对即通过考试。`;
    showModal(finalModal);
  }

  function checkReadyAndSwitch(shouldSwitch){
    updateUI();
    const t=teams[currentPlayerIndex];
    if(t && canTakeExam(t)) actionPrompt.textContent=`【${t.name}】已集齐考试条件，可以参加终极魔法考试！`;
    if(shouldSwitch) setTimeout(startNextTurn,1500);
  }

  function showModal(modal){modalOverlay.style.display='flex'; modal.classList.remove('hidden'); modal.classList.add('flex');}
  function closeAllModals(){[victoryModal,stealModal,choiceModal,spellModal,finalModal].forEach(m=>{m.classList.add('hidden');m.classList.remove('flex')}); modalOverlay.style.display='none';}

  teamCountSelect.addEventListener('change',updateTeamNameInputs);
  startGameBtn.addEventListener('click',()=>{unlockAudio(); setupGame();});
  startRoundBtn.addEventListener('click',()=>{startRoundBtn.classList.add('hidden'); startNextTurn();});
  correctBtn.addEventListener('click',()=>{
    correctBtn.disabled=true; incorrectBtn.disabled=true;
    if(isExtraSpinQuestion){
      isExtraSpinQuestion=false;
      actionPrompt.textContent='漂浮咒成功！请额外转动一次魔法阵。';
      answerControls.classList.add('hidden'); spinBtn.disabled=false; playCorrectSound();
    }else{
      actionPrompt.textContent='施法成功！请点击“转动魔法阵”。';
      answerControls.classList.add('hidden'); spinBtn.disabled=false; playCorrectSound();
    }
  });
  incorrectBtn.addEventListener('click',()=>{
    correctBtn.disabled=true; incorrectBtn.disabled=true;
    isExtraSpinQuestion=false;
    answerControls.classList.add('hidden');
    actionPrompt.textContent=`【${teams[currentPlayerIndex].name}】咒语失败，本轮机会轮空。`;
    playWrongSound(); setTimeout(startNextTurn,1200);
  });
  spinBtn.addEventListener('click',()=>{
    if(isSpinning) return;
    playSpinSound();
    isSpinning=true; spinBtn.disabled=true;
    const extra=Math.floor(Math.random()*6)+5;
    const stop=Math.floor(Math.random()*360);
    currentWheelRotation += extra*360 + stop;
    wheel.style.transform=`rotate(${currentWheelRotation}deg)`;
    const finalAngle=currentWheelRotation%360;
    const winningAngle=(360-finalAngle)%360;
    const result=getWheelResultByAngle(winningAngle);
    setTimeout(()=>handleSpinResult(result),4100);
  });
  finalSuccessBtn.addEventListener('click',()=>{
    const winner=teams[pendingExamTeamIndex];
    closeAllModals();
    victoryMessage.textContent=`恭喜 ${winner.name} 通过终极魔法考试，成为最强小巫师！`;
    showModal(victoryModal); playVictorySound();
  });
  finalFailBtn.addEventListener('click',()=>{
    const t=teams[pendingExamTeamIndex];
    if(t.gems>0)t.gems-=1; else if(t.books>0)t.books-=1;
    closeAllModals();
    playExamFailSound();
    actionPrompt.textContent=`【${t.name}】终极魔法考试失败，失去 1 个资源，继续修炼！`;
    updateUI(); setTimeout(startNextTurn,1200);
  });
  finalCancelBtn.addEventListener('click',closeAllModals);
  backToSetupBtn.addEventListener('click',()=>location.reload());
  window.addEventListener('resize',positionWheelSymbols);
  updateTeamNameInputs();
};
</script>
</body>
</html>
